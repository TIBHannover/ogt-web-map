variables:
  WEBHOOK_URL: "" # Default empty value

build:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
      variables:
        IMAGE_TAG: "stable"
        WEBHOOK_URL: "http://ogt21.service.tib.eu:9000/hooks/pull-latest-image" # Production webhook
        URL: "https://www.gestapo-terror-orte.de"
    - if: $CI_COMMIT_BRANCH =~ /^(develop|feature\/.*)$/
      variables:
        IMAGE_TAG: "testing"
        WEBHOOK_URL: "http://ogt11.test.service.tib.eu:9000/hooks/pull-latest-image" # Testing webhook
        URL: "https://test.gestapo-terror-orte.de"
  script:
    - /kaniko/executor
      --build-arg "APP_URL=${URL}"
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/Dockerfile"
      --destination "${CI_REGISTRY_IMAGE}:${IMAGE_TAG}"
    - echo "WEBHOOK_URL=${WEBHOOK_URL}" >> build.env
  artifacts:
    reports:
      dotenv: build.env
