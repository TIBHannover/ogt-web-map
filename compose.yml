services:
  app:
    image: hub.docker.tib.eu/nfdi4culture/ogt/ogt-api:${DOCKER_VERSION}
    ports:
      - "80:80"
    volumes:
      - storage:/var/www/html/storage
      - ./.env:/var/www/html/.env:ro
      #- ./logs:/var/log/nginx
      #- ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    env_file:
      - ./.env
volumes:
  storage:
    driver: local
