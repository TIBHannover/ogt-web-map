services:
  app:
    image: hub.docker.tib.eu/nfdi4culture/ogt/ogt-api:${DOCKER_VERSION}
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - storage:/var/www/html/storage
      - ./.env:/var/www/html/.env
      #- ./logs:/var/log/nginx
      #- ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    env_file:
      - ./.env
    environment:
      - MAIL_HOST=mailhog
      - MAIL_PORT=1025
      - MAIL_FROM_ADDRESS=noreply@ogt-api.local
      - MAIL_FROM_NAME=OGT-API
    depends_on:
      - mailhog

  mailhog:
    image: mailhog/mailhog
    restart: unless-stopped
    ports:
      - "8025:8025" # Web UI
      - "1025:1025" # SMTP Server
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
volumes:
  storage:
    driver: local
