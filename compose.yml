services:
    app:
        image: hub.docker.tib.eu/nfdi4culture/ogt/ogt-api:${DOCKER_VERSION}
        ports:
            - "80:80"
        volumes:
            - ./storage:/var/www/html/storage
            #- ./.env:/var/www/html/.env:ro
            - ./logs:/var/log/nginx
        environment:
            - APP_ENV=production
            - APP_DEBUG=true # Temporarily enable debug
