services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.local
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - storage:/var/www/html/storage
      - /var/www/html/vendor #
      - ./.env:/var/www/html/.env:ro
      - /var/www/html/node_modules
      - /var/www/html/storage
      - /var/www/html/bootstrap/cache
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - XDEBUG_CONFIG="client_host=host.docker.internal"
    env_file:
      - ./.env
volumes:
  storage:
    driver: local
